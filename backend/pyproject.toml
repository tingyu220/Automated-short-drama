[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "short-drama-delivery"
version = "0.1.0"
description = "短剧投放全流程自动化工作台"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.7",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "playwright",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]
